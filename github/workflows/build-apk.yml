name: Build MAX AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "max-ai.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          mkdir -p source
          unzip -q max-ai.zip -d source

          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper found in the ZIP."
            find source -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          APK=$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "path=${{ steps.project.outputs.dir }}/$APK" \
            >> "$GITHUB_OUTPUT"

      - name: Upload MAX AI APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          retention-days: 7
